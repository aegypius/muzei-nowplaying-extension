# Tests and quality gates. No secrets, no artifacts, nothing signed: producing an
# installable build is a separate workflow, so this one can run on anything.
# See docs/adr/0011-ci-on-github-actions.md.
name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A push that lands while the previous run is still going makes that run
# uninteresting, and this repository has one developer.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to what the developer machine runs, so a check cannot pass in one place
  # and fail in the other over a version.
  LEFTHOOK_VERSION: 2.1.10
  HADOLINT_VERSION: 2.15.1
  COG_VERSION: 7.0.0

jobs:
  # The image is pinned by digest in a file rather than written into each
  # workflow, so the toolchain moves in one commit. A job container cannot read
  # that file itself -- the image is resolved before any step runs -- so it is read
  # here and passed on.
  toolchain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - id: pin
        run: echo "image=$(cat .github/toolchain-image)" >> "$GITHUB_OUTPUT"

  test:
    needs: toolchain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The package is private because the repository is; pulling it needs a token.
      packages: read
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The image has no git, so this downloads a tarball through the REST API
      # instead of cloning. That leaves no .git directory, which the build does not
      # need: the version comes from version.properties, not from git describe.
      - uses: actions/checkout@v5

      # Inside the container, so the JDK and Android SDK are the pinned ones. The
      # Gradle home is set explicitly because the image's own is outside the
      # workspace, where a container job cannot rely on it persisting or on the
      # ownership it was built with.
      - name: Run the tests
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-ci
        run: ./gradlew --console=plain test

  # On the runner rather than in the toolchain image, and deliberately so. The
  # image carries none of what these need: no python3 (the TOML and XML checks),
  # no git (the codeEpoch check), and neither lefthook, hadolint nor cog. Locally
  # those run from the host as git hooks, so the image was never their home, and
  # adding five tools to an image every build pulls buys only symmetry. What is not
  # duplicated is the definitions: lefthook.toml declares them once, and this runs
  # that file.
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # cog check walks the whole history, and a shallow clone has none of it.
          fetch-depth: 0

      # Into RUNNER_TEMP rather than /usr/local/bin, which needs root, and out of
      # the workspace, where lefthook would then check the tools it is running.
      - name: Install the check tools
        run: |
          set -eu
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          releases=https://github.com/

          lefthook="lefthook_${LEFTHOOK_VERSION}_Linux_x86_64"
          curl -fsSL -o "$bin/lefthook" \
            "${releases}evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/$lefthook"
          hadolint=hadolint-linux-x86_64
          curl -fsSL -o "$bin/hadolint" \
            "${releases}hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/$hadolint"
          chmod +x "$bin/lefthook" "$bin/hadolint"

          cog="cocogitto-${COG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "${releases}cocogitto/cocogitto/releases/download/${COG_VERSION}/$cog" \
            | tar -xz -C "$bin" --strip-components=1 --wildcards '*/cog'

          echo "$bin" >> "$GITHUB_PATH"

      # Recorded in the log, so a check that behaves differently here than locally
      # can be compared against the versions it actually ran with. The download URLs
      # pin the versions; this only makes them visible.
      - name: Report the tool versions
        run: |
          set -eu
          lefthook version
          hadolint --version
          cog --version

      # --all-files, because a fresh checkout stages nothing.
      #
      # One job in here cannot fail: code-epoch-not-raised compares the staged
      # version.properties against HEAD, which after a checkout are the same blob.
      # The step below asks the same question of two commits instead.
      - name: Run the pre-commit checks
        run: lefthook run pre-commit --all-files

      # The rule that guards the one unrecoverable mistake, applied where the hook
      # cannot reach: a commit made with --no-verify, or pushed from a clone with no
      # hooks installed. Same script as the hook, a different pair of objects.
      # See ADR-0005.
      - name: Check that codeEpoch was not raised
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          base=$BASE
          # A first push to a branch reports an all-zero "before".
          case "$base" in
            '' | 0000000000000000000000000000000000000000)
              base=$(git rev-parse "$HEAD_SHA^" 2>/dev/null || true)
              ;;
          esac
          if [ -z "$base" ]; then
            echo "no earlier commit to compare against"
            exit 0
          fi
          sh tools/check-code-epoch.sh \
            "$base:version.properties" "$HEAD_SHA:version.properties"

      # The commit messages are what cocogitto derives the version and changelog
      # from, so a malformed one is a lost release note. The commit-msg hook
      # catches it locally; this catches what was committed with the hook skipped.
      - name: Check the commit messages
        run: cog check
