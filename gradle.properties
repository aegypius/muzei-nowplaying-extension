# Gradle runs inside the container, where the JVM gets whatever the host allows.
# 2g is enough for two small modules and keeps the daemon from ballooning.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# The build cache lives in the named volume the justfile mounts at
# GRADLE_USER_HOME, so it survives between container runs.
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official
