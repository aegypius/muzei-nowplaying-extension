# cocogitto configuration. See docs/adr/0005-elapsed-seconds-version-code.md.
#
# `cog bump` owns the semantic version: it derives the next one from Conventional
# Commit types, writes it into version.properties, regenerates CHANGELOG.md,
# commits both and tags. It does not build or publish anything -- every build is
# release-signed and servable already, so a bump only records that the semantic
# version moved.

tag_prefix = "v"
branch_whitelist = ["main"]
ignore_merge_commits = true

# Writes the computed version into version.properties before the bump commit, so
# the build reads a static file and needs neither git nor cocogitto inside the
# container.
#
# A targeted substitution rather than rewriting the file: the codeEpoch constant and
# the comment block explaining it must survive, and only the `name` line is generated
# output. The substitution itself lives in the justfile, which also makes a bump work
# from a subdirectory -- an inline sed was measured failing there.
pre_bump_hooks = ["just _set-version {{version}}"]

[changelog]
path = "CHANGELOG.md"

# No [git_hooks] section on purpose. `lefthook install` renames any hook it does
# not manage to <hook>.old, so a cog-installed commit-msg hook would be silently
# displaced. lefthook.yml declares the conventional-commit check instead and
# calls `cog verify` from there -- one installer, one place to look.
