# Version metadata for Now Playing.
#
# The two values here are maintained in opposite ways. See
# docs/adr/0005-elapsed-seconds-version-code.md.
#
# name -- GENERATED. cocogitto derives the semantic version from Conventional
# Commit types and writes it here during `cog bump`, which commits the change
# and tags it. Editing this line by hand is editing build output.
#
# codeEpoch -- WRITTEN ONCE, NEVER AGAIN. It is the commit timestamp of this
# repository's first commit (5d7530c). versionCode is computed as
# (now - codeEpoch) in seconds. Raising this value lowers every future
# versionCode; Android rejects any build whose versionCode is lower than the
# installed one, so raising it breaks installs silently and is recoverable only
# by uninstalling the app. Lowering it is harmless.

name = 0.0.0
codeEpoch = 1786685201
